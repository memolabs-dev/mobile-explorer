name: Verify SwiftUI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  swift-build:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
